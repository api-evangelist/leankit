openapi: 3.1.0
info:
  title: Planview AgilePlace User Provisioning API (SCIM 1.1)
  version: '1.1'
  description: SCIM 1.1-compliant user provisioning API for Planview AgilePlace (formerly LeanKit). Supports adding, retrieving, searching, updating, deactivating, and deleting users. Only administrator
    users may access it. Extends the SCIM core user with urn:scim:schemas:extension:leankit:user:1.0.
  contact:
    name: Planview AgilePlace Support
    url: https://success.planview.com/Planview_AgilePlace/Support
  x-generated-by: API Evangelist enrichment pipeline — transcribed from the published Planview AgilePlace API reference
externalDocs:
  description: Planview AgilePlace API reference
  url: https://success.planview.com/Planview_AgilePlace/AgilePlace_API
servers:
- url: https://{account}.leankit.com/io/scim/v1
  description: Per-account AgilePlace SCIM host
  variables:
    account:
      default: myaccount
      description: Your AgilePlace account subdomain
security:
- bearerToken: []
- basicAuth: []
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: API token created via POST /io/auth/token or the "My API Tokens" tab in the AgilePlace user profile. Tokens do not expire; revoke unused tokens.
    basicAuth:
      type: http
      scheme: basic
      description: Base64-encoded AgilePlace email and password.
paths:
  /ServiceProviderConfigs:
    get:
      operationId: scimGetServiceProviderConfigs
      summary: Service provider configuration
      description: Configuration information about the API including supported operations and authentication. AgilePlace reports patch, bulk, changePassword, etag, and xmlDataFormat as unsupported; filter
        is supported with maxResults 200 and sort is supported.
      tags:
      - config
      externalDocs:
        description: Provider reference
        url: https://success.planview.com/Planview_AgilePlace/AgilePlace_API/User_Provisioning_API/020User_Provisioning_API_Getting_Started
      responses:
        '200':
          description: Service provider configuration
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - administrator access required
  /Users:
    post:
      operationId: scimCreateUser
      summary: 'Example (minimum) request body: {'
      tags:
      - users
      externalDocs:
        description: Provider reference
        url: https://success.planview.com/Planview_AgilePlace/AgilePlace_API/User_Provisioning_API/User_Provisioning_API%253A_Create_a_User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized - missing or invalid Basic/Bearer credentials
        '403':
          description: Forbidden - authenticated user lacks permission
        '404':
          description: Not found
        '422':
          description: Unprocessable entity - required information was missing or invalid
        '429':
          description: Too Many Requests - rate limit exceeded; see Retry-After and X-RateLimit-Reset headers
          headers:
            Retry-After:
              description: HTTP-date after which the client may retry
              schema:
                type: string
        '500':
          description: Server error on the AgilePlace side
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
    get:
      operationId: scimSearchUsers
      summary: Returns a list of paginated users
      tags:
      - users
      externalDocs:
        description: Provider reference
        url: https://success.planview.com/Planview_AgilePlace/AgilePlace_API/User_Provisioning_API/User_Provisioning_API%253A_Search_for_a_User
      description: Returns a list of paginated users. Supported Querystring Parameters
      responses:
        '200':

        '403':
          description: Forbidden - authenticated user lacks permission
        '404':
          description: Not found
        '422':
          description: Unprocessable entity - required information was missing or invalid
        '429':
          description: Too Many Requests - rate limit exceeded; see Retry-After and X-RateLimit-Reset headers
          headers:
            Retry-After:
              description: HTTP-date after which the client may retry
              schema:
                type: string
        '500':
          description: Server error on the AgilePlace side
  /Users/{id}:
    delete:
      operationId: scimDeleteUser
      summary: Deletes the user
      tags:
      - users
      externalDocs:
        description: Provider reference
        url: https://success.planview.com/Planview_AgilePlace/AgilePlace_API/User_Provisioning_API/User_Provisioning_API%253A_Delete_a_User
      description: Deletes the user. No request body is required. Parameters
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: id identifier
      responses:
        '200':
          description: Success
          content:
            application/json:

aid: leankit
name: LeanKit
description: LeanKit is the enterprise Kanban platform now shipped by Planview as Planview AgilePlace,
  used to visually track and manage the flow of work from strategy to delivery across boards, lanes,
  cards, taskboards, and connected parent/child hierarchies. LeanKit exposes a documented RESTful v2
  API at https://<yourhostname>.leankit.com/io/ covering boards, cards, lanes, comments, attachments,
  card types, custom fields, custom icons, tags, teams, users, board filters, connections, dependencies,
  planning series and increments, and board automations, plus a SCIM 1.1 User Provisioning API and an
  Advanced Reporting export API. Authentication is Basic or Bearer API token, responses are JSON, list
  endpoints page with limit/offset, and every response carries X-RateLimit-* headers. LeanKit was
  acquired by Planview in 2017 and the product was renamed Planview AgilePlace; the leankit.com host
  remains the per-account API and application domain.
url: https://raw.githubusercontent.com/api-evangelist/leankit/refs/heads/main/apis.yml

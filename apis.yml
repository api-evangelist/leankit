apis:
- aid: leankit:advanced-reporting-api
  name: Planview AgilePlace Advanced Reporting API
  description: >-
    Bulk export API for LeanKit / Planview AgilePlace reporting data — cards, card lane positions, blocked
    card history, comments, connections, lanes, tags, and user assignments — consumed from Excel, Power
    BI (including OData), and Tableau web data connectors. Data is not real-time and may be up to 24 hours
    old.
  humanURL: https://success.planview.com/Planview_AgilePlace/Reporting/Advanced_Reporting
  baseURL: https://myaccount.leankit.com/io/reporting

name: LeanKit / Planview AgilePlace MCP candidate
status: candidate
official_server: none
notes: Searched the official Model Context Protocol registry (no results for leankit, agileplace, or planview),
  the github.com/LeanKit and LeanKit-Labs organizations, npm, and the Planview AgilePlace documentation.
  Planview publishes no hosted or remote MCP server for AgilePlace. The one MCP-related artifact found
  on a Planview host is the SafeBase trust-center MCP advertised via https://trust.planview.com/.well-known/oauth-authorization-server
  (issuer https://app.safebase.io/api/mcp) — that belongs to the trust-center platform vendor and exposes
  security documentation, not the AgilePlace API. The tool list below is a candidate derived from real
  operationIds in the transcribed OpenAPI; it is a design proposal, not a shipped server.
transport_candidate: stdio or streamable-http
auth:
  scheme: bearer
  credential: AgilePlace API token (POST /io/auth/token, or the "My API Tokens" profile tab)
  host_variable: LEANKIT_DOMAIN, e.g. mycompany.leankit.com
  see_also: authentication/leankit-authentication.yml
rate_limit_guidance: Any MCP server fronting this API must honour X-RateLimit-Remaining / X-RateLimit-Reset
  and back off on 429 with Retry-After. Limits are per authenticated user and shared across all of that
  user's tokens.

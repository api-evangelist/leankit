write_operation_warning: create_card, update_card, move_card, delete_card, add_card_comment, create_connection,
  and the custom event tools mutate customer work-management state and the API documents no idempotency
  key. Any server implementing them should require explicit confirmation and must not retry a failed write
  blindly.

entries:
- date: '2026-07-16'
  title: Enhanced Dependency Management - GA
  type: addition
  breaking: false
  highlights: >-
    Link cards with incoming and outgoing dependencies, connection timing, and health status (Healthy,
    At risk, Blocked). Connection lines render on the board and cards can be filtered by dependency links.
  api_surface: /io/card/dependency and /io/card/{cardId}/dependency
- date: '2026-06-01'
  title: AgilePlace board filtering update
  type: change
  breaking: false
  highlights: >-
    Board filtering consolidated to a single Highlight mode toggle — one click dims unfiltered cards, a
    second click hides them — replacing the previous separate show and highlight buttons.
- date: '2026-05-15'
  title: Visual Lane Policies now available
  type: addition
  breaking: false
  highlights: >-
    Interactive, enforceable lane- and board-level rules that monitor cards and give immediate visual
    feedback when standards are not met, replacing informal text lane descriptions.
- date: '2026-05-15'
  title: Card import now supports custom fields
  type: addition
  breaking: false
  highlights: >-
    CSV card import maps columns to the custom fields configured on the target board, easing board-to-board
    migration.
- date: '2026-04'
  title: No release notes published for April 2026
  type: none
